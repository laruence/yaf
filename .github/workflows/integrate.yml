name: integrate
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  composer-validate:
    name: "Validate using Composer"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:2.9.5
      - name: Validate
        run: composer validate

  windows-get-extension-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Get the extension matrix
        id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@v1
        with:
          php-version-list: '7.0, 7.1, 7.2, 7.3, 7.4, 8.0, 8.1, 8.2, 8.3, 8.4, 8.5'

  windows-phpt-tests:
    needs: windows-get-extension-matrix
    name: "Windows PHPT Tests"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{fromJson(needs.windows-get-extension-matrix.outputs.matrix)}}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build and test the extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          ts: ${{ matrix.ts }}
          arch: ${{ matrix.arch }}
          run-tests: false

  linux-phpt-tests:
    name: "Linux PHPT Tests"
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        PHP: [ "7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5" ]
        ZTS: [ "no" ]
        include:
          - PHP: "8.4"
            OS: "ubuntu-latest"
            ZTS: true
    env:
      PHP: ${{ matrix.PHP }}
      GITHUB: "yes"
      enable_debug: "yes"
      enable_session: "yes"
      enable_maintainer_zts: ${{ matrix.ZTS }}
      TEST_PHP_ARGS: "--show-diff"
      REPORT_EXIT_STATUS: "yes"
      NO_INTERACTION: "yes"
    steps:

      - name: Install re2c on ubuntu pipeline
        run: sudo apt-get install -y re2c

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup PHP ${{ matrix.PHP }} ${{ matrix.ZTS && 'zts' || 'nts' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.PHP }}
        env:
          phpts: ${{ matrix.ZTS && 'zts' || 'nts' }}
          fail-fast: true

      - name: Build
        run: |
            phpize
            ./configure
            make

      - name: Test
        run: |
            make test
