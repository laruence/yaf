name: linux
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  linux:
    name: "Linux PHP ${{ matrix.php }} (${{ matrix.ts }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.0", "7.4", "8.0", "8.3", "8.4", "8.5"]
        ts: ["nts"]
        include:
          - php: "8.5"
            ts: "ts"
    env:
      PHP: ${{ matrix.php }}
      GITHUB: "yes"
      enable_debug: "yes"
      enable_session: "yes"
      enable_maintainer_zts: ${{ matrix.ts == 'ts' && 'yes' || 'no' }}
      TEST_PHP_ARGS : "--show-diff"
      REPORT_EXIT_STATUS: "yes"
      NO_INTERACTION: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
      - name: Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install
        run: |
          sudo apt-get install -y re2c
      - name: Prepare
        run: |
            phpize
      - name: Build
        run: |
            ./configure
      - name: Make
        run: |
            make
      - name: Test
        run: |
            TEST_PHP_ARGS="$TEST_PHP_ARGS -j$(nproc)" make test
